[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "nacre_shell"
requires-python = ">=3.13"
version = "1.0.0"
dependencies = [
    "pillow==12.3.0",
    "materialyoucolor==3.0.4"
]

[project.scripts]
nacre_shell = "nacre_shell:main"


[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "completions",
    "README.md"
]

[tool.ruff]
line-length = 120
