[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "nacre_shell"
requires-python = ">=3.13"
version = "2.0.0"
description = "Orient: Nacre's independent wallpaper palette engine"
dependencies = ["pillow==12.3.0"]

[project.scripts]
nacre_shell = "nacre_shell:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nacre_shell"]

[tool.ruff]
line-length = 120
