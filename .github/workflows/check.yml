name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install target-platform checks
        run: pacman -Syu --noconfirm --needed git python python-pip python-pillow ruff lua qt6-declarative qt6-wayland quickshell qt6-multimedia qt6-multimedia-ffmpeg qt6-imageformats gcc pkgconf gtk3 nodejs xorg-server-xvfb xorg-xauth mesa dbus ttf-dejavu
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned palette engine in an isolated environment
        run: |
          python -m venv /tmp/check-env
          /tmp/check-env/bin/pip install ./nacre/shell-cli ruff==0.16.10
      - name: Source and native UI regression checks
        run: dbus-run-session -- xvfb-run -a /tmp/check-env/bin/python tools/check.py
