general {
    ignore_empty_input = true
}
background {
    monitor =
    path = $HOME/.cache/siverteh/hyprland-dotfiles/blurred_wallpaper.png
    color = rgba(0b171cff)
}
input-field {
    monitor =
    size = 300, 54
    position = 0, -70
    halign = center
    valign = center
    inner_color = rgba(111f25ff)
    outer_color = rgba(80d9ccff)
    font_color = rgba(e2ebe6ff)
    outline_thickness = 1
    rounding = 12
    dots_size = 0.2
    dots_spacing = 0.3
    fade_on_empty = false
    placeholder_text = Unlock your space
    fail_text = $FAIL
    check_color = rgba(80d9ccff)
    fail_color = rgba(e6bc89ff)
}
label {
    monitor =
    text = cmd[update:1000] date '+%H:%M'
    color = rgba(e2ebe6ff)
    font_size = 72
    font_family = Cantarell
    position = 0, 140
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(80d9ccff)
    font_size = 16
    font_family = Cantarell
    position = 0, 65
    halign = center
    valign = center
}
