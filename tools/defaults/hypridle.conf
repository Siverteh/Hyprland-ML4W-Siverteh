general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    # lock_cmd = playerctl --all-players pause && pidof hyprlock || hyprlock  # pause all system audio and avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = ~/.config/hypr/scripts/hyprctl-lua.sh dpms enable  # avoid pressing a key twice to restore the display.
}

# Lock after 15 minutes without input. Keep the display awake; suspend/lid
# behavior remains owned by logind and the unchanged before/after sleep hooks.
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}
